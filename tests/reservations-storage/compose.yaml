name: forge-reservations-integration
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: reservations_test
      POSTGRES_PASSWORD: local_reservations_test_only
      POSTGRES_DB: reservations_test
    ports:
      - "127.0.0.1:55451:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservations_test -d reservations_test"]
      interval: 2s
      timeout: 3s
      retries: 30
