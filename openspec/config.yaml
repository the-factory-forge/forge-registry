schema: spec-driven

context: |
  This is forge-registry, The Forge's reusable shadcn source registry and showroom.
  Read AGENTS.md and ../forge-spec/AGENTS.md, then the-forge, registry-distribution
  and relevant shared-ui/host-integration specs in ../forge-spec/openspec/specs/.
  Read local openspec/specs/plugins, reservations, registry-showroom and registry-releases
  for registry-specific behavior. Template application specs live in forge-template.
  For Blogs storage, Mailing rendering/transport or plugin persistence, read the local
  concepts/adr decisions. Their linked host-branding and project-migration contracts
  remain shared in forge-spec; template router and deployment decisions remain in forge-template.
  For CSS/Tailwind work, read shared-ui and reuse existing semantic tokens,
  typography, spacing, radii and layout utilities with Tailwind CSS 4.
  If the sibling is absent, use the supplied checkout or canonical repository:
  https://github.com/the-factory-forge/forge-specs. Report unavailable context.
  registry/registry.json owns shipped files/dependencies; public/r is generated
  with pnpm registry:sync. Keep showroom src/lib and src/showroom out of items.
  Shared UI uses props, semantic tokens and ui-shims; hosts own routing, locale,
  auth, content and configuration. Never import another repository's source.
  Read CONTRIBUTING.md, item docs, package scripts, imports and consumers.
  Include generated output and a reviewed consumer install when distribution
  changes. Source updates do not automatically update installed consumers.
  Keep registry-specific specs and changes in this root. Use forge-spec only for
  contracts constraining both registry and template; consumer installation alone
  does not make a plugin spec shared. Name each cross-repository delta's main-spec
  destination and reconcile there without duplicating proposals or main specs.

rules:
  proposal:
    - Identify affected registry items, public contracts, consumers and scope.
  design:
    - Trace shipped files, npm/registry/CSS dependencies and host adapter compatibility.
  tasks:
    - Include relevant showroom discovery, distribution rebuild and consumer verification.
