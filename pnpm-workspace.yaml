allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  vite@*: "catalog:"
  # Only Better Auth's unused test-utils entry point needs this optional peer.
  # Revisit on Better Auth upgrades; never bind it to Vite+'s Vitest 5.
  better-auth@1.7.2>vitest: "-"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
